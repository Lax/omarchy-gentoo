# Omarchy ebuild overlay repository layout.
#
# The overlay is maintained in this repository under gentoo/ and mirrored to
# its own git root (the branch CI publishes) because an ebuild repository must
# sit at the root of the git tree Portage clones. Manifests are thin (DIST
# entries only) and are generated by CI with `pkgdev manifest` at publish and
# validation time, so they never live in this repository.
masters = gentoo
thin-manifests = true
sign-manifests = false
manifest-hashes = BLAKE2B SHA512
cache-formats = md5-dict

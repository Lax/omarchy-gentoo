name: Upstream sync

# The self-managed upstream feed: advance the pinned submodule to omacom's
# master tip, reconcile our ebuilds against the new PKGBUILDs, and push the
# mechanical result straight to master. When a rename is not purely
# mechanical (a pinned URL still names the old release, a marker is missing,
# a row is otherwise unresolvable) the push still happens and an
# agent-actionable issue is filed instead.
#
# Trust: nothing from upstream is executed. PKGBUILDs are sourced only to
# read versions (with CARCH set, the house convention), ebuilds are never
# run here; the merged result is validated post-push by gentoo.yml's gates,
# which file issues on failure - the loop closes itself.
#
# The gates are triggered explicitly: a push made with GITHUB_TOKEN fires
# no push event for other workflows, so until 2026-10-18 automation bumps
# sat ungated and unpublished until the next nightly (or an agent push).
# Each push now dispatches gentoo.yml (lint + sync-check + mirror; the
# smoke stays nightly-owned, see that workflow's dispatch input).
on:
  schedule:
    - cron: "41 */3 * * *" # every 3 hours, off the overlay loop's schedule
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and jq
        run: pacman -Syu --noconfirm git jq

      - name: Clone with submodule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /work
          cd /work
          git config user.name "omarchy-gentoo-ci"
          git config user.email "hello@omarchy.org"

      - name: Bump the pin, reconcile ebuilds, push
        id: work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd /work
          # The clone does not initialize submodules, so update needs --init;
          # compare the pinned gitlink against the submodule tip itself —
          # status-prefix comparisons would read the gitlink on both sides
          # and always report the pin at the tip (this bug silently no-op'd
          # every run before 2026-09-26).
          pinned=$(git ls-tree HEAD omarchy-pkgs | awk '{print $3}')
          git submodule update --init --remote omarchy-pkgs
          tip=$(git -C omarchy-pkgs rev-parse HEAD)
          if [[ "$pinned" != "$tip" ]]; then
            echo "pin: ${pinned} -> ${tip}"
          else
            echo "upstream pin is already at the tip"
          fi
          # Reconcile even at an unchanged pin: drift that pre-dates the pin
          # move (or was missed while the reconcile itself was broken) is
          # picked up here instead of waiting for the next bump.
          bin/sync-gentoo | tee /tmp/reconcile.log
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to reconcile"
            exit 0
          fi
          # Scope the lint resolve to what this bump can affect: the
          # category/name dirs of the ebuilds it touched, captured now -
          # once the commit lands the cached diff is empty. Empty means
          # the commit moves only bookkeeping, and the dispatch then
          # resolves the whole tree - the honest check for a tables-only
          # change. No ebuild matches must not kill the step under
          # set -eu/pipes.
          atoms=$(git diff --cached --name-only -- gentoo/ \
            | { grep -E '\.ebuild$' || true; } \
            | cut -d/ -f2-3 | sort -u | paste -sd, -)
          if [[ "$pinned" != "$tip" ]]; then
            git commit --quiet -m "upstream: bump pin to $(git -C omarchy-pkgs rev-parse --short HEAD), reconcile ebuilds"
          else
            git commit --quiet -m "upstream: reconcile ebuild drift at pin $(git -C omarchy-pkgs rev-parse --short HEAD)"
          fi
          git push --quiet origin master
          echo "pushed $(git rev-parse --short HEAD)"
          # A GITHUB_TOKEN push fires no push event for other workflows, so
          # the overlay gates would never see this bump until the nightly.
          # Dispatch them now (needs actions:write); fail loud - a silent
          # dispatch failure would strand the bump ungated and unpublished.
          payload=$(jq -cn --arg ref master --arg atoms "$atoms" \
            '{ref: $ref, inputs: {smoke: false, resolve_atoms: $atoms}}')
          status=$(curl -sS -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gentoo.yml/dispatches" \
            -d "$payload")
          case "$status" in
            2*) echo "gentoo.yml dispatched" ;;
            *) echo "dispatching gentoo.yml failed (${status}): $(cat /tmp/dispatch.out)"; exit 1 ;;
          esac
          if grep -qE '^skip |FAIL |by hand' /tmp/reconcile.log; then
            echo "needs_human=true" >> "$GITHUB_OUTPUT"
            cp /tmp/reconcile.log /tmp/followup.log
          fi

      - name: File follow-up issue for non-mechanical drift
        if: steps.work.outputs.needs_human == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          head=$(git -C /work log --oneline -1 | awk '{print $1}')
          body=$(printf '%s\n' \
            "The upstream bump in ${head} renamed some ebuilds mechanically, but these rows need an agent or human to finish:" \
            "" "    $(sed 's/$/  /' /tmp/followup.log | tr '\n' ' ')" "" \
            "Read AGENTS.md, fix, verify with \`bin/ai-port --verify <category>/<name>\`, and push to master." \
            "The gates in gentoo.yml validate the result and file further issues if anything is off.")
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$(jq -nc --arg t "upstream sync needs follow-up (automated)" --arg b "$body" \
                  '{title: $t, body: $b, labels: ["gentoo-overlay"]}')"

name: Gentoo tooling

# Offline self-tests for the Gentoo overlay tooling: the scaffolder, the
# port queue, the mapping tables, and the ebuild/PKGBUILD drift checker.
# Deliberately separate from upstream's test.yml (and from gentoo.yml's
# stage3 gates) so this repository can be synced from upstream constantly
# without file conflicts: everything the Gentoo work owns lives in
# gentoo-prefixed files and this workflow.
on:
  pull_request:
    paths:
      - gentoo/**
      - omarchy-pkgs
      - helpers/gentoo-*
      - bin/scaffold-ebuild
      - bin/ai-port
      - bin/gentoo-resolve
      - bin/sync-gentoo
      - bin/gentoo-workflow-lint
      - .github/workflows/gentoo-tooling.yml
      - .github/workflows/gentoo.yml
  push:
    branches: [master]
    paths:
      - gentoo/**
      - omarchy-pkgs
      - helpers/gentoo-*
      - bin/scaffold-ebuild
      - bin/ai-port
      - bin/gentoo-resolve
      - bin/sync-gentoo
      - bin/gentoo-workflow-lint
      - .github/workflows/gentoo-tooling.yml
      - .github/workflows/gentoo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gentoo-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Scaffold, port queue, mapping tables and drift checker
        run: |
          set -euo pipefail
          bin/scaffold-ebuild --self-test
          bin/ai-port --self-test
          bash -n bin/gentoo-resolve
          bash -n bin/sync-gentoo
          bin/sync-gentoo --self-test

      - name: Mapping tables agree with the overlay
        run: |
          set -euo pipefail
          # Every packages.tsv row points at an existing overlay package.
          while IFS=$'\t' read -r arch category gname; do
            case "$arch" in ''|'#'*) continue ;; esac
            [[ -d "gentoo/$category/$gname" ]] || {
              echo "packages.tsv row $arch -> gentoo/$category/$gname has no directory"
              exit 1
            }
            ls "gentoo/$category/$gname/"*.ebuild >/dev/null || {
              echo "gentoo/$category/$gname has no ebuild"
              exit 1
            }
          done < helpers/gentoo-packages.tsv
          # Every ebuild parses as bash and carries the baseline marker the
          # drift checker needs (bin/sync-gentoo --check in gentoo.yml).
          for ebuild in gentoo/*/*/*.ebuild; do
            bash -n "$ebuild"
            # EAPI must be the ebuild's first code line: portage's
            # restricted pre-source parser falls back to EAPI 0 when any
            # other assignment precedes it, and the package then masks as
            # corrupt (SourcingError) - only visible in the heavy gate.
            # Command substitution, not a pipe: `grep | head` under
            # pipefail dies of SIGPIPE on files longer than the pipe
            # buffer, which would fail every large ebuild.
            first_code=$(awk 'NF && $1 !~ /^#/ { print; exit }' "$ebuild")
            [[ "$first_code" == EAPI=* ]] || {
              echo "$ebuild: EAPI= is not its first code line; move global pins below it"
              exit 1
            }
            case "$ebuild" in
              gentoo/acct-group/*) ;; # generated groups carry no baseline
              *)
                grep -q '^# arch-pkgver:' "$ebuild" || {
                  echo "$ebuild is missing its '# arch-pkgver:' baseline marker"
                  exit 1
                }
                ;;
            esac
          done
          # Reverse direction: every overlay package has a table row.
          # Without this an overlay-original meta with no upstream recipe
          # (omarchy-base) can drift silently - the reconcile only walks
          # rows. Deliberate no-row dirs: acct-group shims, portage's
          # generated metadata cache, and migration shims (old-category
          # pointer packages whose ebuilds say "Migration shim"; dropped
          # once users have moved over).
          mapfile -t orphans < <(comm -23 \
            <(find gentoo -mindepth 2 -maxdepth 2 -type d \
                -not -path 'gentoo/acct-group/*' -not -path 'gentoo/metadata/*' \
              | sed 's|^gentoo/||' | sort) \
            <(awk -F '\t' '$1 != "" && $1 !~ /^#/ { print $2 "/" $3 }' \
              helpers/gentoo-packages.tsv | sort))
          real_orphans=()
          for orphan in "${orphans[@]}"; do
            shim=1
            for ebuild in gentoo/"$orphan"/*.ebuild; do
              grep -q 'Migration shim' "$ebuild" || { shim=0; break; }
            done
            [[ "$shim" -eq 1 ]] || real_orphans+=("$orphan")
          done
          for orphan in "${real_orphans[@]}"; do
            echo "gentoo/$orphan has no packages.tsv row"
          done
          [[ "${#real_orphans[@]}" -eq 0 ]] || exit 1

      - name: gentoo.yml docker scripts are quote-safe
        run: |
          set -euo pipefail
          bin/gentoo-workflow-lint --self-test
          bin/gentoo-workflow-lint

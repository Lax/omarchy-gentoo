name: Gentoo overlay

# The Gentoo overlay lives in gentoo/ and is mirrored to the `overlay` branch
# (whose root IS the overlay) because Portage can only sync an ebuild
# repository from the root of a git tree. Manifests never live in this
# repository: they are generated from the distfiles and committed only on the
# mirror branch.
#
# The workflow is self-managed: PRs are gated by static checks, merges are
# mirrored automatically, a package is really emerged nightly behind the
# drift gate (the smoke, on the self-hosted runner) and on demand, the
# unported queue is filed as a tracking issue agents pick work from, and
# any gate failure files an issue so nobody has to watch the Actions tab.
#
# Trust model: PRs may change what the overlay contains (ebuilds), and the
# lint job only ever parses that content with repo-owned tooling inside a
# stock gentoo/stage3 container. Real emerge runs (which execute ebuild code)
# happen exclusively from master: the on-demand smoke job and the mirror.
# Build caches (distfiles, locally built binary packages, ccache) persist
# between runs to keep the desktop-sized closures affordable; everything in
# them was produced by earlier runs of this same pipeline, never fetched
# from a binhost, so the trust surface is unchanged.
on:
  pull_request:
    paths:
      - gentoo/**
      - omarchy-pkgs
      - helpers/gentoo-*
      - bin/scaffold-ebuild
      - bin/ai-port
      - bin/gentoo-resolve
      - bin/sync-gentoo
      - .github/workflows/gentoo.yml
  push:
    branches: [master]
    paths:
      - gentoo/**
      - omarchy-pkgs
      - helpers/gentoo-*
      - bin/scaffold-ebuild
      - bin/ai-port
      - bin/gentoo-resolve
      - bin/sync-gentoo
      - .github/workflows/gentoo.yml
  schedule:
    # Nightly loop (coverage issue, drift check, smoke emerge), 03:17 UTC -
    # off the Arch pipeline's schedule.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# No workflow-level concurrency: the jobs now run on disjoint machines
# (smoke on the self-hosted runner, everything else on GitHub-hosted), and
# serializing push feedback behind a nightly smoke costs hours for no
# safety - mirror is the only writer and each push runs it at most once.

jobs:
  lint:
    # Static validation of the overlay: pkgcheck and per-package emerge
    # --pretend resolution inside a stock gentoo/stage3 container. The job
    # runs on the host (checkout needs git for submodules; the stage3 image
    # ships none) and drives the container through docker run - the same
    # pattern upstream's test.yml uses for its Arch container. No distfiles
    # are fetched here; the nightly job owns Manifest generation.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: pkgcheck scan and resolve every package (stage3)
        run: |
          docker run --rm \
            -v "$PWD/gentoo:/var/db/repos/omarchy" \
            -v "$PWD/bin/gentoo-resolve:/usr/local/bin/gentoo-resolve:ro" \
            gentoo/stage3 bash -c '
              set -eu
              command -v getuto >/dev/null && getuto || true
              emerge-webrsync -q
              test -d /var/db/repos/gentoo/profiles || { emerge-webrsync; test -d /var/db/repos/gentoo/profiles; }
              mkdir -p /etc/portage/repos.conf
              ln -sf /usr/share/portage/config/repos.conf /etc/portage/repos.conf/gentoo.conf
              printf "[omarchy]\nlocation = /var/db/repos/omarchy\nmasters = gentoo\nauto-sync = off\n" > /etc/portage/repos.conf/omarchy.conf
              emerge --quiet dev-util/pkgdev
              pkgcheck scan -k,-MissingManifest --cache-dir /tmp/pkgcheck-cache --verbose /var/db/repos/omarchy
              gentoo-resolve
            '

  smoke-emerge:
    # Real emerge of one rotating package, from master only (see trust model
    # above): an ebuild's dependency closure can still be a full desktop
    # stack, and stage3 builds it from source. This is the one long-running
    # job, so it runs on the maintainer's self-hosted runner (label
    # omarchy-smoke) - hours of compilation stay off the GitHub-hosted
    # quota, and the build caches are plain persistent volumes on that
    # machine (distfiles, locally built binary packages, ccache), written
    # and read only by this same pipeline - never a binhost. The job is
    # schedule/dispatch triggered only, never pull_request, so fork code
    # cannot reach the self-hosted machine. Dependencies may install from
    # the binpkg cache; the smoke atom itself always merges from source so
    # the signal stays real. The runner's stage3 fetches through the local
    # proxy and the aliyun mirror, which is why they are baked into
    # make.conf here. Scheduled nightly but gated: needs the drift check
    # green before it starts, and its own inline pkgcheck scan gates the
    # emerge. Never pull_request (fork code cannot reach the self-hosted
    # machine).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [sync-check]
    runs-on: [self-hosted, omarchy-smoke]
    timeout-minutes: 350
    steps:
      - name: Reset workspace (stage3 writes root-owned md5-cache into the tree)
        run: sudo rm -rf "$GITHUB_WORKSPACE" && mkdir -p "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Manifest, digest-verify, and emerge the package of the day (stage3)
        run: |
          mkdir -p /data/cache/omarchy-runner/distfiles /data/cache/omarchy-runner/binpkgs /data/cache/omarchy-runner/ccache
          docker run --rm --network host \
            -v "$PWD/gentoo:/var/db/repos/omarchy" \
            -v /data/cache/omarchy-runner/distfiles:/var/cache/distfiles \
            -v /data/cache/omarchy-runner/binpkgs:/var/cache/binpkgs \
            -v /data/cache/omarchy-runner/ccache:/var/cache/ccache \
            gentoo/stage3 bash -c '
              set -eu
              command -v getuto >/dev/null && getuto || true
              # Mirrors and the site proxy must be in place BEFORE the tree
              # sync: emerge-webrsync takes the portage snapshot from
              # GENTOO_MIRRORS, and github release assets are reachable only
              # through the local proxy.
              echo "MAKEOPTS=\"-j\$(nproc)\"" >> /etc/portage/make.conf
              echo "LLVM_TARGETS=\"X86 AMDGPU\"" >> /etc/portage/make.conf
              echo "FEATURES=\"\${FEATURES} buildpkg ccache\"" >> /etc/portage/make.conf
              echo "CCACHE_DIR=\"/var/cache/ccache\"" >> /etc/portage/make.conf
              # Mirrors and the site proxy are self-hosted-only network facts
              # and apply there; on a GitHub-hosted runner the defaults are
              # the fast path.
              if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
                echo "GENTOO_MIRRORS=\"https://mirrors.aliyun.com/gentoo/\"" >> /etc/portage/make.conf
                echo "http_proxy=\"http://127.0.0.1:64540\"" >> /etc/portage/make.conf
                echo "https_proxy=\"http://127.0.0.1:64540\"" >> /etc/portage/make.conf
              fi
              mkdir -p /etc/portage/repos.conf
              ln -sf /usr/share/portage/config/repos.conf /etc/portage/repos.conf/gentoo.conf
              # Keyservers are unreachable from the self-hosted site; getuto
              # already provisioned the offline trust keys, so skip the
              # keyring refresh and let webrsync verify against those.
              printf "sync-openpgp-key-refresh = no\n" >> /etc/portage/repos.conf/gentoo.conf
              printf "[omarchy]\nlocation = /var/db/repos/omarchy\nmasters = gentoo\nauto-sync = off\n" > /etc/portage/repos.conf/omarchy.conf
              emerge-webrsync -q
              test -d /var/db/repos/gentoo/profiles || { emerge-webrsync; test -d /var/db/repos/gentoo/profiles; }
              emerge --quiet -k dev-util/ccache dev-util/pkgdev
              cd /var/db/repos/omarchy
              pkgdev manifest --force
              pkgcheck scan --cache-dir /tmp/pkgcheck-cache --verbose /var/db/repos/omarchy
              mapfile -t atoms < <(
                find /var/db/repos/omarchy -name "*.ebuild" -not -path "*/metadata/*" -printf "%h\n" \
                  | sort -u | sed "s|/var/db/repos/omarchy/||"
              )
              (( ${#atoms[@]} > 0 )) || { echo "FATAL: no ebuilds found - the overlay did not reach this container (mount or checkout problem)"; exit 1; }
              pick=$(( $(date +%j) % ${#atoms[@]} ))
              atom="${atoms[$pick]}"
              echo "smoke emerging ${atom} (${pick} of $((${#atoms[@]} - 1)))"
              smoke_deps() {
                CONFIG_PROTECT="-*" FEATURES="-network-sandbox -sandbox buildpkg ccache" ACCEPT_LICENSE="* -@EULA" ACCEPT_KEYWORDS="~amd64" \
                  emerge --verbose -k --onlydeps --autounmask-write --autounmask-continue "${atom}"
              }
              smoke_atom() {
                CONFIG_PROTECT="-*" FEATURES="-network-sandbox -sandbox buildpkg ccache" ACCEPT_LICENSE="* -@EULA" ACCEPT_KEYWORDS="~amd64" \
                  emerge --verbose --autounmask-write --autounmask-continue "${atom}"
              }
              if ! smoke_deps; then
                # A tree-side keyword window (the snapshot of the day ships a
                # dependency only as keywordless) surfaces as a "(masked by:"
                # list. Accept exactly those released versions and retry once
                # - do not blanket-accept **, or autounmask drags every 9999
                # live ebuild into the graph. A second failure is a real
                # failure. NOTE: no apostrophes below - this whole script
                # sits inside one single-quoted bash -c argument.
                masked=$(FEATURES="-network-sandbox -sandbox" ACCEPT_LICENSE="* -@EULA" ACCEPT_KEYWORDS="~amd64" \
                  emerge --pretend --quiet "${atom}" 2>&1 \
                  | sed -n "s/^- \([^ ]*\)::gentoo (masked by:.*/\1/p" \
                  | grep -v -- -9999 || true)
                if [[ -z "${masked}" ]]; then
                  exit 1
                fi
                echo "tree-side keyword window; accepting keywordless: ${masked}"
                mkdir -p /etc/portage/package.accept_keywords
                printf "%s\n" "${masked}" | sed "s/^/=/; s/$/ **/" \
                  > /etc/portage/package.accept_keywords/smoke-tree-window
                smoke_deps
              fi
              smoke_atom
              # stage3 regenerates the md5-cache as root inside the mounted
              # tree; drop it so the persistent workspace stays checkoutable
              # by the runner user on the next job.
              rm -rf /var/db/repos/omarchy/metadata/md5-cache
            '

  sync-check:
    # Ebuild drift from the Arch recipes: upstream's automation bumps
    # PKGBUILDs; this check notices when the co-maintained ebuilds lag and
    # fails so the report job files an issue (an agent or maintainer then
    # runs bin/sync-gentoo <package>, which does the rename). Needs vercmp,
    # so an Arch container, driven from the host like every other gate:
    # base-devel ships neither git (so the container cannot clone itself)
    # nor node (so the JS checkout actions cannot run inside it either).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Check ebuild drift (Arch container)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            archlinux:base-devel bash -c '
              set -eu
              cd /workspace
              bin/sync-gentoo --check
            '

  coverage:
    # File/update the tracking issue that IS the porting backlog: the unported
    # queue from bin/ai-port --list-open, with skips and blockers. This issue
    # is what coding agents pick work from; keep it honest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build the coverage report
        run: |
          {
            echo "Automated porting backlog, regenerated nightly by the"
            echo "[coverage job](../actions/workflows/gentoo.yml). Agents: read"
            echo "AGENTS.md, then hand a row to the agent of your choice with"
            echo '``'
            echo "bin/ai-port <package>"
            echo '``'
            echo "and self-verify with \`bin/ai-port --verify <category>/<name>\`."
            echo
            echo "## Open (unported, in scope)"
            echo '```'
            bin/ai-port --list-open | awk '$3 == "OPEN"'
            echo '```'
            echo "## Intentionally skipped"
            echo '```'
            bin/ai-port --list-open | awk '$3 != "OPEN"'
            echo '```'
            echo "## Currently shipped"
            echo '```'
            awk -F'\t' 'NF >= 3 && $1 !~ /^#/ { printf "%-36s %s/%s\n", $1, $2, $3 }' helpers/gentoo-packages.tsv
            echo '```'
            echo "_Last regenerated: $(date -u +%FT%TZ)_"
          } > coverage-report.md
          cat coverage-report.md

      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh label create gentoo-overlay --repo "$GITHUB_REPOSITORY" \
            --color 495D95 --description "Gentoo overlay automation" 2>/dev/null || true
          title="Gentoo overlay: porting backlog (automated)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "$title in:title" --json number --jq '.[0].number' || true)
          body=$(cat coverage-report.md)
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body "$body" --label "gentoo-overlay"
          fi

  mirror:
    # Publish: regenerate Manifests and fast-forward the `overlay` branch
    # whose tree root is the overlay users sync.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build the overlay tree with fresh Manifests (stage3)
        run: |
          mkdir -p "$PWD/overlay-staging"
          docker run --rm \
            -v "$PWD/gentoo:/var/db/repos/omarchy" \
            -v "$PWD/overlay-staging:/staging" \
            gentoo/stage3 bash -c '
              set -eu
              command -v getuto >/dev/null && getuto || true
              emerge-webrsync -q
              test -d /var/db/repos/gentoo/profiles || { emerge-webrsync; test -d /var/db/repos/gentoo/profiles; }
              mkdir -p /etc/portage/repos.conf
              ln -sf /usr/share/portage/config/repos.conf /etc/portage/repos.conf/gentoo.conf
              printf "[omarchy]\nlocation = /var/db/repos/omarchy\nmasters = gentoo\nauto-sync = off\n" > /etc/portage/repos.conf/omarchy.conf
              emerge --quiet dev-util/pkgdev
              cd /var/db/repos/omarchy
              pkgdev manifest --force
              rm -rf /var/db/repos/omarchy/metadata/md5-cache
              cp -a /var/db/repos/omarchy/. /staging/
            '

      - name: Commit and push the overlay branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config --global user.name "omarchy-gentoo-ci"
          git config --global user.email "hello@omarchy.org"
          # gitlink noise never reaches the mirror; the submodule pointer is
          # management-repo state, not overlay content.
          rm -rf "$PWD/overlay-staging/omarchy-pkgs"

          # Fast-forward history when the overlay branch exists, start it
          # when it does not; then replace the tree wholesale with the
          # freshly generated one.
          if git clone --quiet --branch overlay --single-branch \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              /tmp/overlay 2>/dev/null; then
            :
          else
            mkdir -p /tmp/overlay
            git -C /tmp/overlay init --initial-branch=overlay
          fi

          cd /tmp/overlay
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/overlay-staging/." .
          git config --global --add safe.directory /tmp/overlay

          git add -A
          if git diff --cached --quiet; then
            echo "overlay branch is up to date"
            exit 0
          fi
          git commit --quiet -m "overlay: mirror gentoo/ from ${GITHUB_SHA::12}"
          git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/overlay

  report:
    # Self-managed failure path: nobody watches the Actions tab. Any failing
    # gate on master or the nightly loop opens (or comments on) a single
    # tracking issue with the run link. PR failures stay on the PR checks.
    needs: [lint, smoke-emerge, mirror, sync-check]
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: File a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Gentoo overlay: automated gates failing (automated)"
        run: |
          set -eu
          gh label create gentoo-overlay --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "Gentoo overlay automation" 2>/dev/null || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          failed_jobs=$(echo '${{ toJSON(needs.*.result) }}')
          body=$(printf '%s\n' \
            "A Gentoo overlay gate failed in [run ${GITHUB_RUN_ID}](${run_url})." \
            "" \
            "Job results: \`${failed_jobs}\`" \
            "" \
            "Read AGENTS.md, reproduce locally with \`bin/ai-port --verify <category>/<name>\`" \
            "or the failing job's steps, fix, and PR. This issue is closed" \
            "automatically by the next green run of the same workflow.")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" --body "$body" --label "gentoo-overlay"
          fi

  close-loop:
    # The green half of the failure loop: once every gate passes, close the
    # tracking issue the report job opened, so an open issue always means
    # "master is broken right now".
    needs: [lint, smoke-emerge, mirror, sync-check]
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        !contains(needs.*.result, 'failure') &&
        !contains(needs.*.result, 'cancelled')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Close the gates-failing issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          title="Gentoo overlay: automated gates failing (automated)"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --search "$title in:title state:open" --json number --jq '.[0].number' || true)
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" \
              --comment "All gates green in run ${{ github.run_id }}; closing automatically."
          else
            echo "no open failure issue"
          fi
